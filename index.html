<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffd84d">
  <title>My Social Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      color: #fff;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(rgba(8, 9, 20, .55), rgba(8, 9, 20, .78)),
        url("https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1800&q=85") center / cover fixed;
    }

    .container {
      width: min(100%, 440px);
      padding: 34px 28px;
      text-align: center;
      color: #201a08;
      background: yellow;
      border: 1px solid rgba(255, 255, 255, .65);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .42);
      animation: appear .75s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .profile-img-box {
      width: 132px;
      height: 132px;
      margin: 0 auto 18px;
      padding: 4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #29213d, #f05a78, #ff9b35);
    }

    .profile-img-box img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 32%;
      border: 4px solid yellow;
      border-radius: 50%;
    }

    .name { margin-bottom: 7px; font-size: 28px; font-weight: 700; }
    .bio { margin-bottom: 25px; color: #554718; font-size: 14px; }
    .links-container { display: grid; gap: 12px; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 18px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      background: rgba(27, 24, 36, .92);
      border: 1px solid rgba(27, 24, 36, .18);
      border-radius: 14px;
      transition: transform .2s ease, background .2s ease;
    }

    .btn i { font-size: 19px; }
    .btn:hover { transform: translateY(-3px); }
    .facebook:hover { background: #1877f2; }
    .instagram:hover { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
    .youtube:hover { background: #e60000; }
    footer { margin-top: 24px; color: #554718; font-size: 12px; }

    @media (max-width: 520px) {
      body { background-attachment: scroll; }
      .container { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="profile-img-box">
      <img src="C:/Users/Bikas Nunia/OneDrive/Desktop/logo.jpg" alt="Profile photo">
    </div>

    <h1 class="name">Bikas Nunia</h1>
    <p class="bio">Digital Creator | Connect with me</p>

    <nav class="links-container" aria-label="Social media links">
      <a href="https://www.facebook.com/share/19s3SX5syv/" target="_blank" rel="noopener noreferrer" class="btn facebook">
        <i class="fa-brands fa-facebook-f" aria-hidden="true"></i> Connect on Facebook
      </a>
      <a href="https://www.instagram.com/bi.kas3220/" target="_blank" rel="noopener noreferrer" class="btn instagram">
        <i class="fa-brands fa-instagram" aria-hidden="true"></i> Follow on Instagram
      </a>
      <a href="https://youtube.com/@bikasnunia" target="_blank" rel="noopener noreferrer" class="btn youtube">
        <i class="fa-brands fa-youtube" aria-hidden="true"></i> Visit my YouTube channel
      </a>
    </nav>

    <footer>&copy; 2026 All rights reserved</footer>
  </main>
</body>
</html>
